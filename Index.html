<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RENIT TOURNAMENT</title>
  <style>
    body {
      background-color: #120c2b;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 15px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .profile-section {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .profile-img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #fff;
    }
    .icons {
      display: flex;
      gap: 15px;
    }
    .balance-card {
      background: linear-gradient(135deg, #483d8b, #6a5acd);
      padding: 20px;
      border-radius: 15px;
      text-align: center;
    }
    .balance-amount {
      font-size: 24px;
      font-weight: bold;
      margin: 10px 0;
    }
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .btn {
      background-color: #5d50c1;
      color: #fff;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="profile-section">
      <div class="profile-img"></div>
      <span>হ্যালো, ইউজার ! 👋</span>
    </div>
    <div class="icons">
      <span>🔔</span>
    </div>
  </div>

  <div class="balance-card">
    <span>মূল ব্যালেন্স</span>
    <div class="balance-amount">৳৪০.০০</div>
    <div class="btn-group">
      <button class="btn">+ অ্যাড</button>
      <button class="btn">উইথড্র</button>
    </div>
  </div>
</body>
</html>
