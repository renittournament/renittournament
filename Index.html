<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RENIT TOURNAMENT</title>
    <style>
        body {
            background-color: #120c2b;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 15px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .profile-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .profile-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }
        .btn {
            background-color: #5d50c1;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="profile-section">
            <img src="profile.jpg" alt="Profile" class="profile-img">
            <span>স্বাগতম!</span>
        </div>
        <button class="btn">লগ আউট</button>
    </div>
</body>
</html>
