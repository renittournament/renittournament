<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renit Tournament</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#05040a;
  color:#fff;
  font-family:Arial, sans-serif;
}

.app{
  width:100%;
  max-width:760px;
  min-height:100vh;
  margin:auto;
  background:
    radial-gradient(circle at 80% 10%,#21144b55,transparent 30%),
    linear-gradient(180deg,#0b0713,#07050d);
  position:relative;
  overflow:hidden;
}

/* TOP HEADER */
.top{
  height:105px;
  padding:18px;
  display:flex;
  align-items:center;
  gap:14px;
  border-bottom:1px solid #292137;
  background:#090611ee;
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:blur(15px);
}

.logo{
  width:60px;
  height:60px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#25194a,#100b1e);
  border:1px solid #4a2e88;
  font-size:28px;
}

.brand{
  flex:1;
  min-width:0;
}

.brand h1{
  font-size:23px;
  letter-spacing:1.5px;
  font-weight:900;
  white-space:nowrap;
}

.brand p{
  color:#898293;
  margin-top:5px;
  font-size:14px;
}

.wallet{
  border:0;
  color:#fff;
  font-size:17px;
  font-weight:bold;
  padding:13px 18px;
  border-radius:28px;
  background:linear-gradient(135deg,#6550e8,#8448ff);
  box-shadow:0 8px 25px #6946ff44;
}

/* MAIN */
main{
  padding:20px 16px 120px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.title{
  font-size:27px;
  font-weight:850;
  display:flex;
  align-items:center;
  gap:12px;
}

.title:before{
  content:"";
  width:7px;
  height:38px;
  border-radius:10px;
  background:#7357ff;
  box-shadow:0 0 15px #7357ff;
}

.all{
  color:#7561e9;
  font-weight:bold;
  font-size:16px;
}

/* MATCH GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.card{
  height:270px;
  border-radius:30px;
  position:relative;
  overflow:hidden;
  border:1px solid #42306e;
  background:#171020;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-4px);
  border-color:#765aff;
}

/* CARD BACKGROUNDS */
.art{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 75% 22%,#43a3ffdd,transparent 27%),
    radial-gradient(circle at 25% 30%,#ff753dcc,transparent 23%),
    linear-gradient(135deg,#1557b6,#0d163f 48%,#4c145f);
}

.art.yellow{
  background:
    radial-gradient(circle at 28% 65%,#1687e7,transparent 12%),
    radial-gradient(circle at 66% 45%,#f36f8f,transparent 12%),
    linear-gradient(140deg,#ffd000,#ff9d00 55%,#f04c19);
}

.art.red{
  background:
    radial-gradient(circle at 70% 25%,#d72e45,transparent 27%),
    linear-gradient(145deg,#2b0208,#8d0e17 55%,#260109);
}

.art.blue{
  background:
    radial-gradient(circle at 22% 30%,#54a7ff,transparent 22%),
    radial-gradient(circle at 75% 60%,#1d6fd2,transparent 28%),
    linear-gradient(145deg,#041a47,#081b32 50%,#0b102b);
}

.art.purple{
  background:
    radial-gradient(circle at 60% 35%,#e13b74,transparent 23%),
    linear-gradient(145deg,#2a062a,#6c153f 55%,#18051e);
}

.shade{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      180deg,
      transparent 15%,
      rgba(0,0,0,.25) 45%,
      rgba(5,3,10,.95) 100%
    );
}

.card-content{
  position:absolute;
  left:20px;
  right:15px;
  bottom:18px;
  z-index:2;
}

.card h2{
  font-size:23px;
  line-height:1.05;
  font-weight:900;
  text-shadow:0 2px 8px #000;
}

.count{
  font-size:17px;
  color:#d7d2de;
  margin-top:8px;
}

.live{
  position:absolute;
  right:16px;
  top:16px;
  z-index:3;
  padding:8px 13px;
  border-radius:22px;
  background:#f34f64;
  color:#fff;
  font-size:14px;
  font-weight:bold;
  box-shadow:0 4px 18px #f34f6444;
}

.live:before{
  content:"";
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#fff;
  margin-right:6px;
}

/* FLOATING SUPPORT */
.support{
  position:fixed;
  right:22px;
  bottom:92px;
  width:78px;
  height:78px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#8161ff,#6941ee);
  box-shadow:0 12px 35px #5737dc77;
  z-index:25;
  font-size:34px;
}

.online{
  position:absolute;
  right:7px;
  top:10px;
  width:15px;
  height:15px;
  background:#14cf86;
  border-radius:50%;
  border:3px solid #7450f7;
}

/* BOTTOM NAVIGATION */
.nav{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:100%;
  max-width:760px;
  height:94px;
  background:#160e23f7;
  border-top:1px solid #302247;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  z-index:30;
  backdrop-filter:blur(18px);
}

.nav button{
  border:0;
  background:none;
  color:#60586e;
  font-size:14px;
  font-weight:bold;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  cursor:pointer;
}

.nav .icon{
  font-size:27px;
}

.nav button.active{
  color:#7358ff;
}

.nav button.active .icon{
  width:68px;
  height:46px;
  border-radius:19px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#211746;
}

/* MOBILE */
@media(max-width:520px){

  .top{
    height:92px;
    padding:14px 12px;
  }

  .logo{
    width:52px;
    height:52px;
    border-radius:17px;
  }

  .brand h1{
    font-size:18px;
    letter-spacing:1px;
  }

  .brand p{
    font-size:12px;
  }

  .wallet{
    font-size:15px;
    padding:11px 15px;
  }

  main{
    padding:17px 10px 110px;
  }

  .title{
    font-size:23px;
  }

  .title:before{
    height:30px;
  }

  .all{
    font-size:14px;
  }

  .grid{
    gap:10px;
  }

  .card{
    height:235px;
    border-radius:25px;
  }

  .card h2{
    font-size:20px;
  }

  .count{
    font-size:15px;
  }

  .support{
    width:66px;
    height:66px;
    right:18px;
    bottom:91px;
    font-size:29px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="top">

    <div class="logo">
      🎮
    </div>

    <div class="brand">
      <h1>RENIT TOURNAMENT</h1>
      <p>Hey, sojibmama! 👋</p>
    </div>

    <button class="wallet" onclick="showToast('Wallet: ৳40')">
      ▣ ৳40
    </button>

  </header>


  <!-- MAIN -->
  <main>

    <div class="section-head">

      <div class="title">
        Match Categories
      </div>

      <div class="all"
           onclick="showToast('Showing all matches')">
        All Matches
      </div>

    </div>


    <section class="grid">

      <!-- BR MATCH -->
      <article class="card"
               onclick="openMatch('BR MATCH')">

        <div class="art"></div>
        <div class="shade"></div>

        <div class="live">
          LIVE
        </div>

        <div class="card-content">
          <h2>BR MATCH</h2>
          <div class="count">0 Matches</div>
        </div>

      </article>


      <!-- BR DUO -->
      <article class="card"
               onclick="openMatch('BR-DUO')">

        <div class="art purple"></div>
        <div class="shade"></div>

        <div class="card-content">
          <h2>BR-DUO</h2>
          <div class="count">0 Matches</div>
        </div>

      </article>


      <!-- PLAY ESPORTS -->
      <article class="card"
               onclick="openMatch('PLAY ESPORTS')">

        <div class="art yellow"></div>
        <div class="shade"></div>

        <div class="card-content">
          <h2>PLAY ESPORTS</h2>
          <div class="count">7 Matches</div>
        </div>

      </article>


      <!-- CS -->
      <article class="card"
               onclick="openMatch('CS 4 VS 4')">

        <div class="art red"></div>
        <div class="shade"></div>

        <div class="live">
          LIVE
        </div>

        <div class="card-content">
          <h2>CS 4 VS 4</h2>
          <div class="count">54 Matches</div>
        </div>

      </article>


      <!-- LONE WOLF -->
      <article class="card"
               onclick="openMatch('LONE WOLF 2 VS 2')">

        <div class="art blue"></div>
        <div class="shade"></div>

        <div class="card-content">
          <h2>LONE WOLF 2 VS 2</h2>
          <div class="count">7 Matches</div>
        </div>

      </article>


      <!-- LOST TO WIN -->
      <article class="card"
               onclick="openMatch('LOST TO WIN')">

        <div class="art red"></div>
        <div class="shade"></div>

        <div class="card-content">
          <h2>LOST TO WIN</h2>
          <div class="count">10 Matches</div>
        </div>

      </article>


      <!-- FREE FIRE -->
      <article class="card"
               onclick="openMatch('FREE FIRE')">

        <div class="art blue"></div>
        <div class="shade"></div>

        <div class="live">
          LIVE
        </div>

        <div class="card-content">
          <h2>FREE FIRE</h2>
          <div class="count">12 Matches</div>
        </div>

      </article>


      <!-- SPECIAL -->
      <article class="card"
               onclick="openMatch('SPECIAL MATCH')">

        <div class="art purple"></div>
        <div class="shade"></div>

        <div class="live">
          LIVE
        </div>

        <div class="card-content">
          <h2>SPECIAL MATCH</h2>
          <div class="count">5 Matches</div>
        </div>

      </article>

    </section>

  </main>


  <!-- SUPPORT -->
  <div class="support"
       onclick="showToast('Support chat opened')">

    ◒

    <span class="online"></span>

  </div>


  <!-- BOTTOM NAV -->
  <nav class="nav">

    <button class="active"
            onclick="setNav(this,'Home')">

      <span class="icon">⌂</span>
      <span>Home</span>

    </button>


    <button onclick="setNav(this,'Matches')">

      <span class="icon">🎮</span>
      <span>Matches</span>

    </button>


    <button onclick="setNav(this,'Results')">

      <span class="icon">🏆</span>
      <span>Results</span>

    </button>


    <button onclick="setNav(this,'Profile')">

      <span class="icon">👤</span>
      <span>Profile</span>

    </button>

  </nav>

</div>


<script>

function showToast(message){

  const old = document.querySelector('.toast');

  if(old){
    old.remove();
  }

  const toast = document.createElement('div');

  toast.className = 'toast';

  toast.textContent = message;

  Object.assign(toast.style,{
    position:'fixed',
    left:'50%',
    bottom:'110px',
    transform:'translateX(-50%)',
    background:'#25183d',
    color:'#fff',
    padding:'12px 18px',
    borderRadius:'14px',
    border:'1px solid #4a3473',
    zIndex:99,
    fontWeight:'700',
    boxShadow:'0 10px 30px rgba(0,0,0,.35)'
  });

  document.body.appendChild(toast);

  setTimeout(()=>{
    toast.remove();
  },1800);

}


function openMatch(name){

  showToast(name + ' selected');

}


function setNav(button,name){

  document
    .querySelectorAll('.nav button')
    .forEach(x => x.classList.remove('active'));

  button.classList.add('active');

  showToast(name);

}

</script>

</body>
</html>
